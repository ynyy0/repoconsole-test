name: Refresh APT package indexes

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'icons/**'
      - 'CydiaIcon.png'
      - '.github/workflows/release.yml'
      - '.github/scripts/build_index.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-indexes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install index tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev zstd

      - name: Generate APT indexes and Release
        run: python3 .github/scripts/build_index.py

      - name: Commit refreshed indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add Packages Packages.bz2 Packages.xz Packages.zst Release
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh APT package indexes'
            git pull --rebase origin main || git pull --rebase origin main
            git push
          fi
